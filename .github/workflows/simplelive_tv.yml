name: TV APK (Dummy Signed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ 安装 Flutter（beta）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: false

      # 3️⃣ 创建 local.properties
      - name: Create local.properties
        run: |
          echo "flutter.sdk=${HOME}/flutter" > simple_live_tv_app/local.properties

      # 4️⃣ 创建 dummy keystore
      - name: Create dummy keystore
        run: |
          mkdir -p simple_live_tv_app/android/app/app
          keytool -genkey -v \
            -keystore simple_live_tv_app/android/app/app/keystore.jks \
            -storepass 123456 \
            -alias test \
            -keypass 123456 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI, OU=CI, O=CI, L=City, ST=State, C=CN"

      # 5️⃣ 创建 key.properties
      - name: Create key.properties
        run: |
          echo "storePassword=123456" > simple_live_tv_app/android/key.properties
          echo "keyPassword=123456" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=test" >> simple_live_tv_app/android/key.properties
          echo "storeFile=app/keystore.jks" >> simple_live_tv_app/android/key.properties

      # 6️⃣ Flutter 版本检查
      - name: Flutter version check
        run: flutter --version

      # 6.5️⃣ 删除 pubspec.lock
      - name: Remove pubspec.lock
        run: |
          cd simple_live_tv_app
          rm -f pubspec.lock

      # 🔥 6.6️⃣ 分类页默认站点改为虎牙
      - name: Patch default category site (Huya)
        run: |
          FILE="simple_live_tv_app/lib/modules/category/category_controller.dart"
          sed -i 's/Constant.kBiliBili.obs/Constant.kHuya.obs/' "$FILE"
          sed -i 's/Sites.allSites\[Constant.kBiliBili\]!/Sites.allSites[Constant.kHuya]!/' "$FILE"

      # 🔥 6.7️⃣ 默认清晰度 + 首次运行标记
      - name: Patch default settings
        run: |
          FILE="simple_live_tv_app/lib/app/controller/app_settings_controller.dart"
          sed -i 's/getValue(LocalStorageService.kQualityLevel, 1)/getValue(LocalStorageService.kQualityLevel, 2)/' "$FILE"
          sed -i 's/getValue(LocalStorageService.kFirstRun, true)/getValue(LocalStorageService.kFirstRun, false)/' "$FILE"

      # 🔥 6.8️⃣ 强制 media_kit 版本
      - name: Force media_kit versions
        run: |
          PUBSPEC="simple_live_tv_app/pubspec.yaml"
          sed -i 's/^  media_kit:.*/  media_kit: 1.1.11/' "$PUBSPEC"
          sed -i 's/^  media_kit_video:.*/  media_kit_video: 1.2.5/' "$PUBSPEC"
          sed -i 's/^  media_kit_libs_android_video:.*/  media_kit_libs_video: 1.0.5/' "$PUBSPEC"

      # 🔥 6.9️⃣ 首页按钮顺序调整（热门直播 ↔ 直播类目互换）
      - name: Patch home buttons order (swap 2 buttons)
        run: |
          FILE="simple_live_tv_app/lib/modules/home/home_page.dart"

          # 1️⃣ 将热门直播三行替换成占位符1/2/3
          sed -i 's/text: "热门直播"/text: "PLACEHOLDER_1"/' "$FILE"
          sed -i 's/iconData: Remix.fire_line/iconData: PLACEHOLDER_2/' "$FILE"
          sed -i 's/onTap: controller.toHotLive/onTap: PLACEHOLDER_3/' "$FILE"

          # 2️⃣ 将直播类目三行改成热门直播对应内容
          sed -i 's/text: "直播类目"/text: "热门直播"/' "$FILE"
          sed -i 's/iconData: Remix.apps_line/iconData: Remix.fire_line/' "$FILE"
          sed -i 's/onTap: controller.toCategory/onTap: controller.toHotLive/' "$FILE"

          # 3️⃣ 将占位符1/2/3 替换为直播类目原始内容
          sed -i 's/text: "PLACEHOLDER_1"/text: "直播类目"/' "$FILE"
          sed -i 's/iconData: PLACEHOLDER_2/iconData: Remix.apps_line/' "$FILE"
          sed -i 's/onTap: PLACEHOLDER_3/onTap: controller.toCategory/' "$FILE"

          # 4️⃣ 删除所有占位符（清理残留）
          sed -i '/PLACEHOLDER_/d' "$FILE"

      # 7️⃣ 构建 APK
      - name: Build TV APK
        run: |
          cd simple_live_tv_app
          flutter pub get
          flutter build apk --release --split-per-abi

      # 8️⃣ 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-tv-apk-dummy
          path: simple_live_tv_app/build/app/outputs/flutter-apk/*.apk
